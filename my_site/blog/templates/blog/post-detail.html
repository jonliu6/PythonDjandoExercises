{% extends "base.html" %}
{% load static %}

{% block title %}
    {{ post.title }}
{% endblock %}

{% block content %}
    <section id="summary">
        <h2>{{ post.title }}</h2>
        <article class="post">
            <img src="{% static "blog/images/"|add:post.image %}" alt="{{ post.title }}" />
            <address>By {{ post.author }} on {{ post.date|date:"d M Y" }}</address>
            <p>{{ post.excerpt }}</p>
        </article>
    </section>

<main>
    <p>{{ post.content|linebreaks }}</p>
</main>

{% endblock %}
