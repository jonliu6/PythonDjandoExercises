{% extends "base.html" %}

{% block title %}
My Stored Posts
{% endblock %}

{% block content %}
    <section>
        <ul>
            {% for post in posts %}
                <li>
                    <a href="{% url 'post-detail-page' post.slug %}">{{ post.title }}</a>
                </li>
            {% empty %}
                <li>No stored posts.</li>
            {% endfor %}
        </ul>
    </section>
{% endblock %}
