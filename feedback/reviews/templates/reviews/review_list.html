{% extends "reviews/base.html" %}
{% block title %}Reviews{% endblock %}
{% block content %}
  <h1>Reviews</h1>
  <ul>
    {% for review in reviews %}
      <li>
        <strong>{{ review.user_name }}</strong> - {{ review.rating }} stars
        <p>{{ review.review_text }}</p>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
